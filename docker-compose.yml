name: primus-historical-market-data

x-collector-gate-environment: &collector-gate-environment
  PRIMUS_HMD_B0_SEED_APPROVED: ${PRIMUS_HMD_B0_SEED_APPROVED:-}
  PRIMUS_HMD_B0_SEED_RUNNER: ${PRIMUS_HMD_B0_SEED_RUNNER:-}
  PRIMUS_HMD_OPERATIONAL_EVENTS: ${PRIMUS_HMD_OPERATIONAL_EVENTS:-enabled}
  # Provider libraries must never default to writing profiles/caches at `/`
  # when collectors run as the non-root numeric UID.  These are ephemeral
  # container paths, deliberately separate from canonical storage and state.
  HOME: /tmp/primus-hmd-home
  XDG_CONFIG_HOME: /tmp/primus-hmd-home/.config
  XDG_CACHE_HOME: /tmp/primus-hmd-home/.cache
  MPLCONFIGDIR: /tmp/primus-hmd-home/.config/matplotlib

x-get-data-service: &get-data-service
  image: ${PRIMUS_HMD_IMAGE_REF:?PRIMUS_HMD_IMAGE_REF is required}
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      PYTHON_BASE_IMAGE: ${PRIMUS_HMD_PYTHON_BASE_IMAGE:?PRIMUS_HMD_PYTHON_BASE_IMAGE must be pinned by digest}
  restart: unless-stopped
  # A bare `docker compose up` must never start a writer.  Operators target a
  # named service after the B0 status has accepted the relevant controls.
  profiles: ["collectors"]
  user: "${PRIMUS_HMD_COLLECTOR_UID:?PRIMUS_HMD_COLLECTOR_UID is required}:${PRIMUS_HMD_COLLECTOR_GID:?PRIMUS_HMD_COLLECTOR_GID is required}"
  pids_limit: 256
  cpus: 1.0
  mem_limit: 1536m
  env_file:
    - path: ${PRIMUS_HMD_SECRETS_FILE:?PRIMUS_HMD_SECRETS_FILE is required}
      required: true
  environment:
    <<: *collector-gate-environment
  volumes:
    - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/storage:/app/storage
    - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/state:/app/state
    - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/logs:/app/logs
    # Build evidence is readable by collectors but never writable from one.
    - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/releases:/app/releases:ro

services:
  b0-discord-monitor:
    image: ${PRIMUS_HMD_IMAGE_REF:?PRIMUS_HMD_IMAGE_REF is required}
    restart: unless-stopped
    user: "${PRIMUS_HMD_COLLECTOR_UID:?PRIMUS_HMD_COLLECTOR_UID is required}:${PRIMUS_HMD_COLLECTOR_GID:?PRIMUS_HMD_COLLECTOR_GID is required}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 0.25
    mem_limit: 256m
    entrypoint: ["python", "-m", "collectors.b0_discord_monitor"]
    command: ["--loop-seconds", "${PRIMUS_HMD_MONITOR_INTERVAL_SECONDS:-60}"]
    environment:
      HISTORICAL_MARKET_DATA_RUNTIME_ROOT: /runtime
      DISCORD_WEBHOOK_URL_FILE: /run/secrets/primus_hmd_discord_webhook
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/storage:/runtime/storage:ro
      - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/state:/runtime/state:ro
      - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/state/monitoring:/runtime/state/monitoring
    secrets:
      - primus_hmd_discord_webhook

  crypto-1m-live:
    <<: *get-data-service
    # Do not rely on the collector's multi-symbol default here.  Each staged
    # service below is an owner-approved, B0-seeded tail only. B0 observed
    # a 136 MiB peak for this family; 512 MiB keeps bounded tail headroom.
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    command: ["python", "-m", "collectors.crypto_1m", "--mode", "live", "--symbols", "BTCUSDT"]
    environment:
      <<: *collector-gate-environment
      # This approval is intentionally injected into this one staged service
      # only.  The image entrypoint additionally requires the exact command.
      PRIMUS_HMD_STAGED_CRYPTO_1M_APPROVED: ${PRIMUS_HMD_STAGED_CRYPTO_1M_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  phase-d-binance-usdm-perpetual-1m:
    <<: *get-data-service
    # A detached, idempotent source-rebuild batch.  It is intentionally in a
    # separate profile and has one service-scoped approval; it cannot inherit
    # the B0 tail approval or start from a bare Compose invocation.
    profiles: ["phase-d"]
    restart: "no"
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1536m
    command: ["python", "-m", "collectors.binance_usdm_perpetual_1m", "--mode", "once", "--symbols", "BTCUSDT", "--start-month", "2020-01", "--daily-bridge-days", "35", "--rest-bridge-days", "35", "--rest-window-minutes", "10080"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_PHASE_D_BINANCE_USDM_PERPETUAL_1M_APPROVED: ${PRIMUS_HMD_PHASE_D_BINANCE_USDM_PERPETUAL_1M_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  phase-d-binance-spot-1m:
    <<: *get-data-service
    # The next sequential Phase D raw-source rebuild.  One worker keeps each
    # Vision archive bounded; streaming audit/repair runs before this one-shot
    # exits and it never expands beyond the reviewed BTCUSDT scope.
    profiles: ["phase-d"]
    restart: "no"
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1536m
    command: ["python", "-m", "collectors.binance_spot_1m", "--mode", "once", "--symbols", "BTCUSDT", "--backfill-start", "2018-01-01", "--max-workers", "1", "--repair-gaps"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_PHASE_D_BINANCE_SPOT_1M_APPROVED: ${PRIMUS_HMD_PHASE_D_BINANCE_SPOT_1M_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  phase-d-vn30f1m-vndirect-daily:
    <<: *get-data-service
    # Raw continuous-alias daily history only.  It fetches one provider year
    # at a time, excludes partial current-day bars, and emits Phase D audit
    # evidence; it does not rebuild the VN matrix or contract-derived series.
    profiles: ["phase-d"]
    restart: "no"
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    command: ["python", "-m", "collectors.vn_derivatives", "sync-vndirect", "--resolution", "1d", "--mode", "once", "--start", "2017-08-10", "--overlap-days", "14", "--audit-phase-d", "--json"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_PHASE_D_VN30F1M_VNDIRECT_DAILY_APPROVED: ${PRIMUS_HMD_PHASE_D_VN30F1M_VNDIRECT_DAILY_APPROVED:-}
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  phase-d-binance-futures-metrics-5m:
    <<: *get-data-service
    # BTCUSDT raw metrics only. Vision download concurrency is explicitly two;
    # writes/audit remain per partition and no legacy host import is allowed.
    profiles: ["phase-d"]
    restart: "no"
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1536m
    command: ["python", "-m", "collectors.binance_futures_metrics_5m", "--mode", "once", "--symbols", "BTCUSDT", "--start-date", "2020-01-01", "--max-workers", "2", "--no-legacy", "--rest-tail-days", "7", "--rest-overlap-hours", "24", "--audit-phase-d"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_PHASE_D_BINANCE_FUTURES_METRICS_5M_APPROVED: ${PRIMUS_HMD_PHASE_D_BINANCE_FUTURES_METRICS_5M_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  phase-d-binance-usdm-quarterly-1m:
    <<: *get-data-service
    # Concrete BTCUSDT quarterly contracts only.  Discovery is restricted by
    # pair, each archive is appended atomically, and a per-contract streaming
    # audit must pass before this detached historical job exits successfully.
    profiles: ["phase-d"]
    restart: "no"
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1536m
    command: ["python", "-m", "collectors.binance_usdm_quarterly_1m", "--mode", "once", "--pairs", "BTCUSDT", "--start-month", "2021-02", "--rest-bridge-days", "7", "--repair-gaps", "--max-gap-minutes", "5", "--audit-phase-d"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_PHASE_D_BINANCE_USDM_QUARTERLY_1M_APPROVED: ${PRIMUS_HMD_PHASE_D_BINANCE_USDM_QUARTERLY_1M_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  phase-e-binance-usdm-core-perpetual-1m:
    <<: *get-data-service
    # Explicit configured-core expansion only.  Each requested symbol is an
    # active USD-M perpetual; source listing dates are recorded rather than
    # fabricated back to the shared 2020 policy start.
    profiles: ["phase-e"]
    restart: "no"
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1536m
    command: ["python", "-m", "collectors.binance_usdm_perpetual_1m", "--mode", "once", "--symbols", "ETHUSDT,SOLUSDT,BNBUSDT,DOGEUSDT", "--start-month", "2020-01", "--daily-bridge-days", "35", "--rest-bridge-days", "35", "--rest-window-minutes", "10080", "--phase-label", "e", "--allow-later-start"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_PHASE_E_BINANCE_USDM_CORE_PERPETUAL_1M_APPROVED: ${PRIMUS_HMD_PHASE_E_BINANCE_USDM_CORE_PERPETUAL_1M_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  phase-e-binance-orderbook-history-1h:
    <<: *get-data-service
    # Retain the full currently documented 2,500-day Vision horizon for the
    # perpetual and current/next BTC quarterly contracts.  Provider gaps are
    # recorded; this service never creates synthetic order-book snapshots.
    profiles: ["phase-e"]
    restart: "no"
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1536m
    command: ["python", "-m", "collectors.binance_orderbook_snapshot_1h", "--mode", "once", "--symbols", "BTCUSDT,BTCUSDT_260925,BTCUSDT_261225", "--lookback-days", "2500", "--phase-e-audit", "--fail-on-symbol-error"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_PHASE_E_BINANCE_ORDERBOOK_HISTORY_1H_APPROVED: ${PRIMUS_HMD_PHASE_E_BINANCE_ORDERBOOK_HISTORY_1H_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  phase-e-vn-daily-universe-1d:
    <<: *get-data-service
    # `--configured-universe` is deliberate: this publishes raw daily history
    # for the reviewed config and only then rebuilds the matrix from canonical
    # raw Parquet.  The FPT B0 tail is not mistaken for full history.
    profiles: ["phase-e"]
    restart: "no"
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1536m
    command: ["python", "-m", "collectors.vn_daily", "--mode", "once", "--configured-universe", "--backfill-start", "2016-01-01", "--force-history", "--resume-success-after", "2026-08-14T05:25:00+00:00", "--audit-phase-e", "--fail-on-symbol-error"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_PHASE_E_VN_DAILY_UNIVERSE_1D_APPROVED: ${PRIMUS_HMD_PHASE_E_VN_DAILY_UNIVERSE_1D_APPROVED:-}
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  phase-e-vn30f1m-vndirect-1m:
    <<: *get-data-service
    # The only historical VNDIRECT 1m writer: it embeds source proof, scans
    # backwards in bounded windows, and fails on structural audit errors.
    profiles: ["phase-e"]
    restart: "no"
    pids_limit: 128
    cpus: 0.50
    mem_limit: 768m
    command: ["python", "-m", "collectors.vn_derivatives", "sync-vndirect", "--resolution", "1m", "--mode", "once", "--start", "2017-08-10", "--window-days", "31", "--min-window-days", "7", "--require-source-proof", "--audit-phase-e", "--json"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_PHASE_E_VN30F1M_VNDIRECT_1M_APPROVED: ${PRIMUS_HMD_PHASE_E_VN30F1M_VNDIRECT_1M_APPROVED:-}
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  phase-e-vn30-contract-source-probe:
    <<: *get-data-service
    # Non-publishing representative proof.  A full KBS/DNSE contract batch
    # is intentionally absent until this evidence proves source coverage.
    profiles: ["phase-e"]
    restart: "no"
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    command: ["python", "-m", "collectors.vn_derivatives", "probe", "--version", "v1", "--contracts", "VN30F1709,VN30F2406,VN30F2508,VN30F2608", "--providers", "kbs,dnse", "--window-days", "30", "--json"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_PHASE_E_VN30_CONTRACT_SOURCE_PROBE_APPROVED: ${PRIMUS_HMD_PHASE_E_VN30_CONTRACT_SOURCE_PROBE_APPROVED:-}
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  binance-usdm-quarterly-1m:
    <<: *get-data-service
    # Explicit current contract and REST tail only: no archive listing or
    # historical Vision monthly/daily download.
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    command: ["python", "-m", "collectors.binance_usdm_quarterly_1m", "--mode", "live", "--pairs", "BTCUSDT", "--symbols", "BTCUSDT_260925", "--no-archive-discovery", "--no-monthly", "--no-daily", "--sleep", "21600"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_STAGED_BINANCE_USDM_QUARTERLY_1M_APPROVED: ${PRIMUS_HMD_STAGED_BINANCE_USDM_QUARTERLY_1M_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  crypto-1m-core-live:
    <<: *get-data-service
    # Separate from the BTC B0 tail so an exact Phase E approval cannot widen
    # its command or start an implicit default universe.
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    command: ["python", "-m", "collectors.crypto_1m", "--mode", "live", "--symbols", "ETHUSDT,SOLUSDT,BNBUSDT,DOGEUSDT"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_STAGED_CRYPTO_CORE_1M_APPROVED: ${PRIMUS_HMD_STAGED_CRYPTO_CORE_1M_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  binance-usdm-quarterly-next-1m:
    <<: *get-data-service
    # The next listed BTC quarterly has archive history already but needs its
    # own explicit REST tail; it must not change the existing active contract.
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    command: ["python", "-m", "collectors.binance_usdm_quarterly_1m", "--mode", "live", "--pairs", "BTCUSDT", "--symbols", "BTCUSDT_261225", "--no-archive-discovery", "--no-monthly", "--no-daily", "--sleep", "21600"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_STAGED_BINANCE_USDM_QUARTERLY_NEXT_1M_APPROVED: ${PRIMUS_HMD_STAGED_BINANCE_USDM_QUARTERLY_NEXT_1M_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  binance-orderbook-expanded-1h:
    <<: *get-data-service
    # REST tails for the same three symbols held by the Phase E order-book
    # rebuild; Vision archive sync remains exclusive to the one-shot service.
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    # Preserve the same approved 2,500-day historical horizon as the one-shot.
    # This tail uses REST only, so it must never fall back to the generic 30-day
    # retention default and prune Phase E archive evidence.
    command: ["python", "-m", "collectors.binance_orderbook_snapshot_1h", "--mode", "live", "--symbols", "BTCUSDT,BTCUSDT_260925,BTCUSDT_261225", "--lookback-days", "2500", "--no-vision", "--no-validate", "--sleep", "3600"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_STAGED_BINANCE_ORDERBOOK_EXPANDED_1H_APPROVED: ${PRIMUS_HMD_STAGED_BINANCE_ORDERBOOK_EXPANDED_1H_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn30f1m-vndirect-1m:
    <<: *get-data-service
    # Starts only after the Phase E source-proven 1m one-shot has passed.
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    command: ["python", "-m", "collectors.vn_derivatives", "sync-vndirect", "--resolution", "1m", "--mode", "live", "--overlap-minutes", "10", "--sleep", "60"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_STAGED_VN30F1M_VNDIRECT_1M_APPROVED: ${PRIMUS_HMD_STAGED_VN30F1M_VNDIRECT_1M_APPROVED:-}
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  binance-spot-1m:
    <<: *get-data-service
    # REST tail only; archive sync, broad gap repair, and full-history audit
    # remain separate approved jobs.
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    command: ["python", "-m", "collectors.binance_spot_1m", "--mode", "live", "--symbols", "BTCUSDT", "--no-monthly", "--no-daily", "--no-validate", "--sleep", "75"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_STAGED_BINANCE_SPOT_1M_APPROVED: ${PRIMUS_HMD_STAGED_BINANCE_SPOT_1M_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  binance-orderbook-snapshot-1h:
    <<: *get-data-service
    # The BTC-only B0 tail shares storage with the Phase E expanded tail.  It
    # remains REST-only, but must retain the same reviewed history so a future
    # accidental restart cannot prune archive evidence.
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    command: ["python", "-m", "collectors.binance_orderbook_snapshot_1h", "--mode", "live", "--symbols", "BTCUSDT", "--lookback-days", "2500", "--no-vision", "--no-validate", "--sleep", "3600"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_STAGED_BINANCE_ORDERBOOK_SNAPSHOT_1H_APPROVED: ${PRIMUS_HMD_STAGED_BINANCE_ORDERBOOK_SNAPSHOT_1H_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  binance-futures-metrics-5m:
    <<: *get-data-service
    # Bounded REST tail for the B0-seeded BTCUSDT perpetual only.  Archive,
    # legacy import, and full-history audit stay disabled.
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    command: ["python", "-m", "collectors.binance_futures_metrics_5m", "--mode", "live", "--symbols", "BTCUSDT", "--no-legacy", "--no-vision", "--rest-tail-days", "1", "--rest-overlap-hours", "1", "--no-validate", "--sleep", "21600"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_STAGED_BINANCE_FUTURES_METRICS_5M_APPROVED: ${PRIMUS_HMD_STAGED_BINANCE_FUTURES_METRICS_5M_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn-daily:
    <<: *get-data-service
    # B0-seeded FPT tail only; the 272-symbol universe and derived matrix are
    # intentionally not started by this staged service.
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    command: ["python", "-m", "collectors.vn_daily", "--mode", "live", "--symbols", "FPT", "--schedule", "16:30", "--skip-derived"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_STAGED_VN_DAILY_APPROVED: ${PRIMUS_HMD_STAGED_VN_DAILY_APPROVED:-}
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn-intraday-stocks:
    <<: *get-data-service
    command: ["python", "-m", "collectors.vn_intraday_vnstock", "--mode", "live", "--schedule", "16:30"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn30f1m-dnse:
    <<: *get-data-service
    profiles: ["legacy-vn30f1m-dnse"]
    restart: "no"
    command: ["python", "-m", "collectors.vn_intraday_dnse", "--mode", "live", "--symbols", "VN30F1M", "--schedule", "16:30"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn30f1m-vndirect-probe:
    <<: *get-data-service
    profiles: ["bootstrap", "vn-derivatives"]
    restart: "no"
    command: ["python", "-m", "collectors.vn_derivatives", "probe-vndirect", "--json"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn30f1m-vndirect:
    <<: *get-data-service
    # Retained daily tail only.  Matrix rebuild is a separate derived-data
    # operation and full contract backfill remains disabled.
    pids_limit: 128
    cpus: 0.50
    mem_limit: 512m
    command: ["python", "-m", "collectors.vn_derivatives", "sync-vndirect", "--resolution", "1d", "--mode", "live", "--schedule", "16:30", "--overlap-days", "14"]
    environment:
      <<: *collector-gate-environment
      PRIMUS_HMD_STAGED_VN30F1M_VNDIRECT_APPROVED: ${PRIMUS_HMD_STAGED_VN30F1M_VNDIRECT_APPROVED:-}
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn-derivatives-probe:
    <<: *get-data-service
    profiles: ["bootstrap", "vn-derivatives"]
    restart: "no"
