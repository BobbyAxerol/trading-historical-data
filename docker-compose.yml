name: primus-historical-market-data

x-collector-gate-environment: &collector-gate-environment
  PRIMUS_HMD_B0_SEED_APPROVED: ${PRIMUS_HMD_B0_SEED_APPROVED:-}
  PRIMUS_HMD_B0_SEED_RUNNER: ${PRIMUS_HMD_B0_SEED_RUNNER:-}
  PRIMUS_HMD_OPERATIONAL_EVENTS: ${PRIMUS_HMD_OPERATIONAL_EVENTS:-enabled}
  # Provider libraries must never default to writing profiles/caches at `/`
  # when collectors run as the non-root numeric UID.  These are ephemeral
  # container paths, deliberately separate from canonical storage and state.
  HOME: /tmp/primus-hmd-home
  XDG_CONFIG_HOME: /tmp/primus-hmd-home/.config
  XDG_CACHE_HOME: /tmp/primus-hmd-home/.cache
  MPLCONFIGDIR: /tmp/primus-hmd-home/.config/matplotlib

x-get-data-service: &get-data-service
  image: ${PRIMUS_HMD_IMAGE_REF:?PRIMUS_HMD_IMAGE_REF is required}
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      PYTHON_BASE_IMAGE: ${PRIMUS_HMD_PYTHON_BASE_IMAGE:?PRIMUS_HMD_PYTHON_BASE_IMAGE must be pinned by digest}
  restart: unless-stopped
  # A bare `docker compose up` must never start a writer.  Operators target a
  # named service after the B0 status has accepted the relevant controls.
  profiles: ["collectors"]
  user: "${PRIMUS_HMD_COLLECTOR_UID:?PRIMUS_HMD_COLLECTOR_UID is required}:${PRIMUS_HMD_COLLECTOR_GID:?PRIMUS_HMD_COLLECTOR_GID is required}"
  pids_limit: 256
  cpus: 1.0
  mem_limit: 1536m
  env_file:
    - path: ${PRIMUS_HMD_SECRETS_FILE:?PRIMUS_HMD_SECRETS_FILE is required}
      required: true
  environment:
    <<: *collector-gate-environment
  volumes:
    - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/storage:/app/storage
    - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/state:/app/state
    - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/logs:/app/logs
    # Build evidence is readable by collectors but never writable from one.
    - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/releases:/app/releases:ro

services:
  b0-discord-monitor:
    image: ${PRIMUS_HMD_IMAGE_REF:?PRIMUS_HMD_IMAGE_REF is required}
    restart: unless-stopped
    user: "${PRIMUS_HMD_COLLECTOR_UID:?PRIMUS_HMD_COLLECTOR_UID is required}:${PRIMUS_HMD_COLLECTOR_GID:?PRIMUS_HMD_COLLECTOR_GID is required}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 0.25
    mem_limit: 256m
    entrypoint: ["python", "-m", "collectors.b0_discord_monitor"]
    command: ["--loop-seconds", "${PRIMUS_HMD_MONITOR_INTERVAL_SECONDS:-60}"]
    environment:
      HISTORICAL_MARKET_DATA_RUNTIME_ROOT: /runtime
      DISCORD_WEBHOOK_URL_FILE: /run/secrets/primus_hmd_discord_webhook
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/storage:/runtime/storage:ro
      - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/state:/runtime/state:ro
      - ${PRIMUS_HMD_RUNTIME_ROOT:?PRIMUS_HMD_RUNTIME_ROOT is required}/state/monitoring:/runtime/state/monitoring
    secrets:
      - primus_hmd_discord_webhook

  crypto-1m-live:
    <<: *get-data-service
    command: ["python", "-m", "collectors.crypto_1m", "--mode", "live"]
    environment:
      <<: *collector-gate-environment
      # This approval is intentionally injected into this one staged service
      # only.  The image entrypoint additionally requires the exact command.
      PRIMUS_HMD_STAGED_CRYPTO_1M_APPROVED: ${PRIMUS_HMD_STAGED_CRYPTO_1M_APPROVED:-}
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  binance-usdm-quarterly-1m:
    <<: *get-data-service
    command: ["python", "-m", "collectors.binance_usdm_quarterly_1m", "--mode", "live"]
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  binance-spot-1m:
    <<: *get-data-service
    command: ["python", "-m", "collectors.binance_spot_1m", "--mode", "live", "--repair-gaps"]
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  binance-orderbook-snapshot-1h:
    <<: *get-data-service
    command: ["python", "-m", "collectors.binance_orderbook_snapshot_1h", "--mode", "live"]
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  binance-futures-metrics-5m:
    <<: *get-data-service
    command: ["python", "-m", "collectors.binance_futures_metrics_5m", "--mode", "live"]
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn-daily:
    <<: *get-data-service
    command: ["python", "-m", "collectors.vn_daily", "--mode", "live", "--schedule", "16:30"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn-intraday-stocks:
    <<: *get-data-service
    command: ["python", "-m", "collectors.vn_intraday_vnstock", "--mode", "live", "--schedule", "16:30"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn30f1m-dnse:
    <<: *get-data-service
    profiles: ["legacy-vn30f1m-dnse"]
    restart: "no"
    command: ["python", "-m", "collectors.vn_intraday_dnse", "--mode", "live", "--symbols", "VN30F1M", "--schedule", "16:30"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn30f1m-vndirect-probe:
    <<: *get-data-service
    profiles: ["bootstrap", "vn-derivatives"]
    restart: "no"
    command: ["python", "-m", "collectors.vn_derivatives", "probe-vndirect", "--json"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn30f1m-vndirect:
    <<: *get-data-service
    command: ["python", "-m", "collectors.vn_derivatives", "sync-vndirect", "--resolution", "1d", "--mode", "live", "--schedule", "16:30", "--update-matrix"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn-derivatives-probe:
    <<: *get-data-service
    profiles: ["bootstrap", "vn-derivatives"]
    restart: "no"
    command: ["python", "-m", "collectors.vn_derivatives", "probe", "--json"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn-derivatives-source-probe:
    <<: *get-data-service
    profiles: ["bootstrap", "vn-derivatives"]
    restart: "no"
    command: ["python", "-m", "collectors.vn_derivatives", "probe-free-sources", "--json"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn-derivatives-bootstrap:
    <<: *get-data-service
    profiles: ["bootstrap", "vn-derivatives"]
    restart: "no"
    command: ["python", "-m", "collectors.vn_derivatives", "backfill", "--start", "2017-08-10", "--resolutions", "1m,1d", "--json"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn-derivatives-validate:
    <<: *get-data-service
    profiles: ["bootstrap", "vn-derivatives"]
    restart: "no"
    command: ["python", "-m", "collectors.vn_derivatives", "validate", "--json"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  vn-derivatives:
    <<: *get-data-service
    command: ["python", "-m", "collectors.vn_derivatives", "live", "--schedule", "16:30"]
    environment:
      <<: *collector-gate-environment
      TZ: Asia/Ho_Chi_Minh
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs
      VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
      DNSE_API_KEY: ${DNSE_API_KEY:-}
      DNSE_API_SECRET_KEY: ${DNSE_API_SECRET_KEY:-}

  options-binance-5m:
    <<: *get-data-service
    command: ["python", "-m", "collectors.binance_options_snapshot", "--mode", "live", "--interval-minutes", "5"]
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  binance-daily-matrix:
    <<: *get-data-service
    command: ["python", "-m", "collectors.binance_daily_matrix", "--mode", "live", "--schedule", "00:05", "--backfill-start", "2020-01-01", "--min-history-days", "365"]
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  deribit-option-backfill-2022:
    <<: *get-data-service
    profiles: ["bootstrap", "deribit"]
    restart: "no"
    command: ["python", "-m", "collectors.deribit_option_trades", "backfill", "--version", "v1", "--expiry-end", "2022-12-31", "--max-tasks", "${DERIBIT_BACKFILL_MAX_TASKS:-500}", "--progress-every", "${DERIBIT_PROGRESS_EVERY:-25}"]
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  deribit-option-backfill-full:
    <<: *get-data-service
    profiles: ["bootstrap", "deribit-full"]
    restart: "no"
    command: ["python", "-m", "collectors.deribit_option_trades", "backfill", "--version", "v1", "--max-tasks", "${DERIBIT_BACKFILL_MAX_TASKS:-500}", "--progress-every", "${DERIBIT_PROGRESS_EVERY:-25}"]
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  deribit-option-cycle-2022:
    <<: *get-data-service
    profiles: ["bootstrap", "deribit"]
    restart: "no"
    command:
      - "sh"
      - "-c"
      - >
        python -m collectors.deribit_option_trades backfill --version v1 --expiry-end 2022-12-31 --max-tasks ${DERIBIT_BACKFILL_MAX_TASKS:-500} --progress-every ${DERIBIT_PROGRESS_EVERY:-25}
        && python -m collectors.deribit_option_trades compact --version v1 --progress-every ${DERIBIT_PROGRESS_EVERY:-25}
        && python -m collectors.deribit_option_trades repair-contracts --version v1 --confirm --json
        && python -m collectors.deribit_option_trades validate --version v1 --json
        && python -m collectors.deribit_option_trades cleanup --version v1 --confirm --json
        && python -m collectors.deribit_option_trades validate --version v1 --json
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  deribit-option-cycle-full:
    <<: *get-data-service
    profiles: ["bootstrap", "deribit-full"]
    restart: "no"
    command:
      - "sh"
      - "-c"
      - >
        python -m collectors.deribit_option_trades backfill --version v1 --max-tasks ${DERIBIT_BACKFILL_MAX_TASKS:-500} --progress-every ${DERIBIT_PROGRESS_EVERY:-25}
        && python -m collectors.deribit_option_trades compact --version v1 --progress-every ${DERIBIT_PROGRESS_EVERY:-25}
        && python -m collectors.deribit_option_trades repair-contracts --version v1 --confirm --json
        && python -m collectors.deribit_option_trades validate --version v1 --json
        && python -m collectors.deribit_option_trades cleanup --version v1 --confirm --json
        && python -m collectors.deribit_option_trades validate --version v1 --json
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  deribit-option-compact:
    <<: *get-data-service
    profiles: ["bootstrap", "deribit"]
    restart: "no"
    command: ["python", "-m", "collectors.deribit_option_trades", "compact", "--version", "v1", "--progress-every", "${DERIBIT_PROGRESS_EVERY:-25}"]
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  deribit-option-validate:
    <<: *get-data-service
    profiles: ["bootstrap", "deribit"]
    restart: "no"
    command: ["python", "-m", "collectors.deribit_option_trades", "validate", "--version", "v1", "--json"]
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  deribit-option-repair:
    <<: *get-data-service
    profiles: ["bootstrap", "deribit"]
    restart: "no"
    command: ["python", "-m", "collectors.deribit_option_trades", "repair", "--version", "v1", "--only-unresolved", "--json"]
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

  deribit-option-cleanup:
    <<: *get-data-service
    profiles: ["bootstrap", "deribit"]
    restart: "no"
    command: ["python", "-m", "collectors.deribit_option_trades", "cleanup", "--version", "v1", "--confirm", "--json"]
    environment:
      <<: *collector-gate-environment
      TZ: UTC
      DATA_ROOT: /app/storage
      STATE_ROOT: /app/state
      LOG_ROOT: /app/logs

secrets:
  primus_hmd_discord_webhook:
    file: ${PRIMUS_HMD_DISCORD_WEBHOOK_FILE:?PRIMUS_HMD_DISCORD_WEBHOOK_FILE is required}
