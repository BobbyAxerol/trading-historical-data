# Owner-approved Phase D source-rebuild policy.  This permits one exact,
# one-shot historical job at a time; it does not relax the B0 tail contracts.
schema_version: 1

phase_d_approval:
  status: approved
  approved_by: BobbyAxerol
  approved_at: "2026-08-13T16:18:00+00:00"
  scope: "Sequential clean new-VPS BTCUSDT Binance USD-M perpetual, spot 1m, futures metrics 5m, and VNDIRECT VN30F1M daily continuous-alias rebuilds only. No old-VPS import, default-universe expansion, derived matrix, consumer cutover, destructive operation, or Deribit request."
  runtime_profile:
    max_concurrent_historical_jobs: 1
    cpus: 1.0
    memory_mib: 1536
    pids: 256
    restart: "no"
  services:
    phase-d-binance-usdm-perpetual-1m:
      dataset_id: crypto_binance_futures_1m
      command: ["python", "-m", "collectors.binance_usdm_perpetual_1m", "--mode", "once", "--symbols", "BTCUSDT", "--start-month", "2020-01", "--daily-bridge-days", "35", "--rest-bridge-days", "35", "--rest-window-minutes", "10080"]
      sources:
        - binance_vision_usdm_monthly
        - binance_vision_usdm_daily_bridge
        - binance_usdm_rest_bounded_bridge
      validation: per-partition streaming schema/OHLC/negative/duplicate/continuity/tail audit
    phase-d-binance-spot-1m:
      dataset_id: crypto_binance_spot_1m
      command: ["python", "-m", "collectors.binance_spot_1m", "--mode", "once", "--symbols", "BTCUSDT", "--backfill-start", "2018-01-01", "--max-workers", "1", "--repair-gaps"]
      sources:
        - binance_vision_spot_monthly
        - binance_vision_spot_daily
        - binance_spot_rest_tail_and_bounded_gap_repair
      validation: streaming per-partition schema/OHLC/negative/duplicate/continuity audit; known upstream gaps stay explicit rather than synthetic
    phase-d-vn30f1m-vndirect-daily:
      dataset_id: vn30f1m_vndirect_dchart_1d
      command: ["python", "-m", "collectors.vn_derivatives", "sync-vndirect", "--resolution", "1d", "--mode", "once", "--start", "2017-08-10", "--overlap-days", "14", "--audit-phase-d", "--json"]
      sources:
        - vndirect_dchart_continuous_alias_daily
      validation: per-year append/deduplicate and streaming schema/OHLC/negative/duplicate/source-provenance audit; strict trading-calendar continuity is asserted from 2024 where the project holiday calendar is complete
    phase-d-binance-futures-metrics-5m:
      dataset_id: crypto_binance_futures_metrics_5m
      command: ["python", "-m", "collectors.binance_futures_metrics_5m", "--mode", "once", "--symbols", "BTCUSDT", "--start-date", "2020-01-01", "--max-workers", "2", "--no-legacy", "--rest-tail-days", "7", "--rest-overlap-hours", "24", "--audit-phase-d"]
      sources:
        - binance_vision_usdm_daily_metrics
        - binance_futures_data_rest_tail
      validation: streaming per-month schema/5-minute-bucket/numeric/negative/duplicate/continuity/partial-day/source-provenance audit; fail closed on a non-passing durable Phase D report

deribit:
  status: disabled_by_owner
  reason: "Explicitly deferred for this session."
