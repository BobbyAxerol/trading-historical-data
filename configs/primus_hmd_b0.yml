# Phase B0 policy. Values marked REQUIRED deliberately keep the B0 preflight
# blocked until the operator records real evidence for this new VPS.
schema_version: 1

environment:
  id: primus-hmd-do-sgp1-20260813
  required_timezones:
    - UTC
    - Asia/Ho_Chi_Minh
  rollback:
    previous_approved_release: "REQUIRED: previous wheel/release identifier"
    previous_approved_data_root: "REQUIRED: one approved data root, never a mixed root"

# Owner-approved temporary exceptions.  These entries make deferred controls
# visible as `waived` in preflight; they never claim that the controls passed.
# They permit data collection only, never consumer cutover or old-root mixing.
accepted_technical_debt:
  backup_and_restore:
    status: approved_deferred
    approved_by: BobbyAxerol
    approved_at: "2026-08-13T08:45:00+00:00"
    reason: "Owner deferred off-host backup destination and restore drill as technical debt."
    must_close_before: "Phase E consumer cutover, old-writer retirement, or any destructive data operation."
  consumer_rollback:
    status: approved_deferred
    approved_by: BobbyAxerol
    approved_at: "2026-08-13T08:45:00+00:00"
    reason: "Owner deferred selection of a previous approved wheel and single data root as technical debt."
    must_close_before: "Phase E consumer cutover; no mixed-root fallback is ever allowed."

b0_seed_approval:
  status: approved
  approved_by: BobbyAxerol
  approved_at: "2026-08-13T08:45:00+00:00"
  scope: "Sequential bounded new-VPS seed writes only; no old-VPS data import and no broad concurrent backfill."

# Audit record for the one post-B0 writer approved in this session.  Compose
# and the image entrypoint enforce the same literal command; this record does
# not approve any default-symbol expansion, other service, backfill, or
# consumer cutover.
staged_crypto_1m_approval:
  status: approved
  approved_by: BobbyAxerol
  approved_at: "2026-08-13T08:45:00+00:00"
  service: crypto-1m-live
  dataset_id: crypto_binance_futures_1m
  command: ["python", "-m", "collectors.crypto_1m", "--mode", "live", "--symbols", "BTCUSDT"]
  scope: "Single BTCUSDT 1m Binance futures tail writer only; no default-symbol expansion, no other collector, no broad historical backfill, and no consumer cutover."

runtime:
  root: /srv/primus/historical-market-data
  source_checkout: /srv/primus/src/historical-market-data
  collector_uid: 1000
  collector_gid: 1000
  reader_group: primus-market-data-readers
  # Numeric host evidence is intentional: the slim collector image does not
  # carry the host's group database, so B0 validates the recorded ACL GID
  # instead of treating a missing in-container group name as a false failure.
  reader_group_gid: 996
  required_directories:
    - storage
    - state
    - logs
    - releases

capacity:
  os_reserve_gib: 20
  state_log_reserve_gib: 5
  docker_cache_reserve_gib: 10
  datasets:
    - dataset_id: binance_perpetual_spot_quarterly
      canonical_target_gib: null
      peak_staging_gib: null
      source_window: config-defined
      max_concurrent_jobs: 1
    - dataset_id: binance_metrics_orderbook
      canonical_target_gib: null
      peak_staging_gib: null
      source_window: retention-defined
      max_concurrent_jobs: 1
    - dataset_id: vn_daily_derivatives
      canonical_target_gib: null
      peak_staging_gib: null
      source_window: provider-defined
      max_concurrent_jobs: 1
    - dataset_id: deribit_btc_options_v1_compact_liquid
      canonical_target_gib: 9
      peak_staging_gib: 20
      source_window: full-v1
      max_concurrent_jobs: 1

concurrency:
  policy: single-heavy-job-until-bounded-seed-evidence
  mutually_exclusive_families:
    - [binance_perpetual_spot_quarterly, binance_metrics_orderbook]
    - [binance_perpetual_spot_quarterly, deribit_btc_options_v1_compact_liquid]
    - [binance_metrics_orderbook, deribit_btc_options_v1_compact_liquid]
    - [vn_daily_derivatives, deribit_btc_options_v1_compact_liquid]

source_inventory:
  runtime_path: state/bootstrap/source_inventory.json
  template_path: docs/b0/source_inventory.template.json

storage_manifest:
  runtime_path: storage/_primus_metadata/release_manifest.json
  supported_loader_contract_versions:
    - hmd-loader-v1
  incompatible_reader_policy: raise-clear-compatibility-error

backup:
  destination: "REQUIRED: off-host destination URI or managed backup identifier"
  retention: "REQUIRED: documented retention policy"
  restore_drill_status: pending

monitoring:
  heartbeat_max_age_minutes: 20
  free_disk_low_water_gib: 30
  inode_low_water_pct: 10
  expected_heartbeat_datasets:
    - crypto_binance_futures_1m
    - crypto_binance_usdm_quarterly_1m
    - crypto_binance_spot_1m
    - crypto_binance_futures_metrics_5m
    - crypto_binance_orderbook_snapshot_1h
    - vn_equity_1d
    - vn30f1m_vndirect
  # The runtime bootstrap evidence lists only services that are actually
  # scheduled.  One-shot B0 seeds are deliberately not registered here.
  discord_monitor_state_relative_path: state/monitoring/discord_monitor.json
  discord_monitor_max_age_minutes: 3
  retry_rate_limit_window_minutes: 10
  default_rss_limit_mb: 1024
  rss_limit_mb_by_dataset:
    crypto_binance_futures_1m: 1024
    crypto_binance_usdm_quarterly_1m: 1024
    crypto_binance_spot_1m: 1024
    crypto_binance_futures_metrics_5m: 1024
    crypto_binance_orderbook_snapshot_1h: 512
    vn_equity_1d: 768
    vn30f1m_vndirect: 768
    deribit_btc_options_v1_compact_liquid: 750
  operator_status_command: python -m collectors.b0_operational_status --strict --json
  resource_policy: single-heavy-job-until-bounded-seed-evidence
