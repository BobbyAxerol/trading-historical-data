[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "primus-historical-market-data"
version = "0.1.0rc1"
description = "Read-only loaders for Primus historical market data"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.5.5",
  "pandas==2.2.3",
  "pyarrow==20.0.0",
]

[tool.setuptools]
py-modules = ["data_loader"]

[tool.setuptools.packages.find]
include = ["primus*", "loaders*"]
exclude = ["tests*", "tools*", "storage*", "state*", "logs*", "openapi_sdk*"]
